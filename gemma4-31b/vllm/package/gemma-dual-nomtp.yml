# ===========================================================================
# MODEL-RECIPES :: gemma4-31b / vllm / package :: gemma-dual-nomtp.yml
#
# The 0.29.0 package template (the rebase). Stock vllm/vllm-openai:v0.29.0,
# overlay-free, MTP-OFF / long-ctx shape (the drafter-off sibling of
# gemma-dual.yml) — never a fork (the doctrine). This file is the PACKAGE
# default. A box's machine .env (gemma-dual-nomtp.env, beside its start
# bat) overrides these keys key-by-key; at boot the start script composes them
#   docker compose -f package/gemma-dual-nomtp.yml -f gemma-dual-nomtp.env
# (a key set in the .env wins; the package default stands otherwise).
#
# Provenance (this file)
#   rebased      2026-09-12, Phase 1 of the vLLM 0.29.0 rebase. Stock
#                v0.28.0 base -> v0.29.0. Overlay-free: no patch bundles, so
#                nothing to drop or re-anchor — the rebase is the base bump.
#   base         vllm/vllm-openai:v0.29.0 (Model-Runner-V2 line); a version
#                bump edits the image line in place.
#   parent       the pre-rebase package yml (club3090/gemma-dual-nomtp.yml,
#                v0.28.0, the MTP-off / box-fit long-ctx shape) — this file is
#                that body with the 0.29.0 deltas below.
#
# Deltas (this body vs stock baseline/gemma-dual-nomtp.yml; enforced by
#   _shared/scripts/yml-provenance.py check, manifest: deltas/gemma-dual-nomtp.txt)
#   1. image:      stock v0.29.0 (the rebase's base pin).
#   2. environment: the machine-tunable knobs are literal package defaults here
#                  (the env is a MAP, not a list, so the machine .env feeds it, winning per key
#                  key-by-key); the drafter is OFF by default (SPEC_N 0).
#   3. command:    the 09-04 box-fit that the pre-rebase body hard-shipped in the
#                  yml (189000 @ 0.93) is demoted to the machine .env: the
#                  --max-model-len / --gpu-memory-utilization lines become knobs
#                  defaulting to the source's clean-card form (229376 @ 0.95),
#                  and the box-fit is a machine edit (T11 — a stability envelope
#                  is box-scoped, never a package bug, and survives rebase).
#   4. volumes:    templates at ../templates (model level); detect_nvlink at
#                  ../scripts/ (model level); the two JIT caches keep their
#                  ${HOME}-rooted form (the WSL distro stays the cache home).
#   5. everything else (entrypoint, the drafter toggle, the gemma4 tool +
#                  reasoning parsers, the invariants) is byte-identical to the
#                  pre-rebase body.
#
# Invariants (carried from the pre-rebase body): restart "no"; the
#   CUDA_VISIBLE_DEVICES=${DEVICE_PAIR} + PCI_BUS_ID pin; expandable_segments:False;
#   VLLM_WSL2_ENABLE_PIN_MEMORY; VLLM_ALLOW_LONG_MAX_MODEL_LEN; the NVLink
#   auto-detect + conditional --disable-custom-all-reduce; TP=2 / PP=1; the
#   bf16 KV auto default; MAX_NUM_SEQS 2; the 4096 batched tokens; the gemma4
#   tool + reasoning parsers; the 8033 port; the two served names.
#
#   NOTE: this tier is the drafter-OFF / long-ctx shape (SPEC_N 0). The
#   MTP-on sibling is gemma-dual.yml. If the 0.29.0 base regresses Gemma-4
#   MTP x tool-calling, that is the MTP sibling's concern, not this tier's.
#
# Re-assert (the gate that keeps this file honest):
#   python3 _shared/scripts/yml-provenance.py check \
#     --yml gemma4-31b/vllm/package/gemma-dual-nomtp.yml \
#     --source gemma4-31b/vllm/baseline/gemma-dual-nomtp.yml \
#     --manifest gemma4-31b/vllm/deltas/gemma-dual-nomtp.txt
#   python3 _shared/scripts/yml-provenance.py lint --yml <this file>
#
# ===[model-recipes:provenance:end]===
# ===========================================================================
# Profile (at-a-glance):
#   Model:     Gemma 4 31B — cyankiwi QAT-AWQ-INT4 (compressed-tensors, lm_head bf16)
#   Topology:  Dual 3090 (TP=2, NVLink auto-detected via NVLINK_MODE)
#   Drafter:   none — MTP OFF by this yml's shape (the entrypoint default is
#             0; the sibling gemma-dual.yml is the MTP-on 179040 shape)
#   KV:        bf16 (engine-default; overlay-free — no #40391, no cliff)
#   Vision:    yes
#   Max ctx:   229376 (~224K) — bf16 KV pool ceiling on 2× 3090 @ util 0.95 (est. ~237K tok;
#              ship below it for a healthy VRAM margin. This yml ships it
#              hard at the box's proven 0.93, re-aimed 09-04: the
#              source's 0.95/229376 assumed cleaner cards - here the
#              startup-free 22.59 GiB is below 0.95's 22.79 demand
#              (the WSL2/WDDM baseline ~1.4 GiB/card), and 229376's 12.27
#              GiB of KV cannot fit under 11.34 GiB/rank of weights at any
#              utilization on a 23.99 GiB card. The window is the pool's
#              measured arithmetic (09-04 4th boot): 10.82 GiB of KV ->
#              191232 ceiling, pinned 189000 as the wobble margin.
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    ⚠️ Production w/ caveats
#   Caveats:   (1) MTP (speculative decoding) DISABLED on vLLM v0.24.0 — Gemma-4 MTP×tool-calling
#              is broken upstream (vLLM #39043; MTP fix #42006 closed-unmerged); plain chat + tools
#              (without MTP) work. Re-enable when a stable vLLM ships the fix — see block below.
#              (2) Context ceiling ~224K (bf16 KV is ~2×/token vs int8-PTH's 262K) — the overlay-free
#              trade for retiring the 31b's vllm-gemma-stable dependence. int8-PTH+#40391 (262K)
#              returns FREE when PR #40391 merges upstream.
#   Quality:   rebench-full 2026-07-02 @0.95/229376: verify-full 9/9 (tools+streaming-tool-calls+
#              reasoning clean, MTP-off) · verify-stress all 5 ceiling rungs to 210K (91%, VRAM
#              margin 1162MB>1024 ✓) · bench decode ~59 TPS (CV 0.1%, TTFT 69ms) · soak PASS
#              (0 err · 0 MiB growth · 0/100 silent · p50 58.7 · 99.6% retention). 8-pack deferred.
#   Best for:  The Gemma-4-31B dual on v0.24.0 — OVERLAY-FREE (stock vllm-stable), vision + tools. ⭐
# ---------------------------------------------------------------------------
# Gemma-4-31B (cyankiwi QAT-AWQ-INT4) on 2× RTX 3090 TP=2, stock vLLM v0.24.0.
#
# WHY cyankiwi qat-AWQ-int4 (not autoround-int4): on v0.24.0, gemma4.py ties the
# lm_head through its quant method, and AutoRound (which quantizes the tied
# lm_head) raises NotImplementedError at model init. cyankiwi's compressed-tensors
# checkpoint keeps lm_head EXCLUDED from quant (bf16), so the tie dispatches to the
# unquantized path → boots clean. QAT-int4 is also ≥ AutoRound-int4 fidelity (§4a).
#
# WHY bf16 KV (this is the whole point of the v0.24.0 consolidation):
#   bf16 is the engine-default KV — it needs NO overlay. Gemma-4's sliding_window=1024
#   windows most layers, so bf16 KV is cheap enough to reach ~224–250K on 2× 3090.
#   int8-PTH would give the full 262K but needs the #40391 page-align overlay, which is
#   NOT native in v0.24.0 (it boots but SILENTLY craters recall past ~32K — verified
#   2026-07-01, both cyankiwi + w4a16 checkpoints; PR #40391 is open/conflicting upstream).
#   So the overlay-free 31b ships bf16; int8-PTH returns free when #40391 merges.
#   (fp8 KV is dead on Gemma-4 Ampere: sm_86 lacks the fp8e4nv kernel; TurboQuant is
#   arch-blocked — heterogeneous head dims force TRITON_ATTN, which rejects TQ dtypes.)
#
# ──────────────────────────────────────────────────────────────────────────
# ⏸️ MTP (speculative decoding) DISABLED on v0.24.0 — re-enable when upstream lands.
#   Why: Gemma-4 MTP × tool-calling is broken on stock v0.24.0 — with spec-decode ON,
#   tool calls emit <pad> / leak raw <|tool_call> tokens instead of parsed calls.
#   (Plain chat is fine; tools WITHOUT MTP are fine — A/B-verified on this rig 2026-07-01:
#   MTP-off → tools PASS, MTP-on → tools FAIL.) Root cause = upstream vLLM #39043; the
#   MTP fix (#42006) is closed-unmerged and NOT in v0.24.0.
#   Re-enable trigger: a stable vLLM release carrying the #39043 / #42006 fixes. Check:
#     gh api repos/vllm-project/vllm/issues/39043 --jq '.state, .state_reason'
#     gh api repos/vllm-project/vllm/pulls/42006  --jq '.state, .merged_at'
#   Then add the two --speculative-config lines + re-run a streaming multi-tool test
#   (must return all args, no leak) before shipping:
#     - --speculative-config
#     - '{"model":"/root/.cache/huggingface/gemma-4-31b-it-assistant","num_speculative_tokens":${SPEC_N_MAX:-3}}'
# ──────────────────────────────────────────────────────────────────────────
#
# Companion composes:
#   single (TP=1) — Gemma-4-31B is DUAL-ONLY on 24 GB (weights fit a single card but leave
#                   only a few-K ctx). Needs ≥32 GB for single-card long-context.
#
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 24
# Engine-profile: vllm-stable
# Requires-min-gpu-count: 2
# Tensor-parallel: 2
services:
  vllm-gemma-4-31b-qat-awq-int4:
    image: vllm/vllm-openai:v0.29.0
    container_name: gemma-serve-nomtp
    restart: "no"
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-8033}:8000"
    volumes:
      - ${WEIGHTS_DIR:-../../weights}:/root/.cache/huggingface
      # Google Gemma 4 CANONICAL chat template (published 2026-07-09) — vendored;
      # the image-bundled example predates Google's fix (see the patch README).
      - ../templates:/templates:ro
      # torch.compile + Triton kernel caches — first boot warms (~5-7 min);
      # subsequent boots reuse cached graphs (~3 min).
      - ${HOME}/model-recipes-rt/gemma4-31b/cache/torch_compile_qatawq:/root/.cache/vllm/torch_compile_cache
      - ${HOME}/model-recipes-rt/gemma4-31b/cache/triton_qatawq:/root/.triton/cache
      # NVLink auto-detection — runs inside container at boot.
      - ../scripts/detect_nvlink.sh:/etc/vllm-patches/detect_nvlink.sh:ro
      # NO overlay mounts — overlay-free on stock v0.24.0 (bf16 KV needs no patch).
    environment:
      # -- model + drafter (nomtp: drafter OFF by default; the MTP-on sibling
      #    gemma-dual.yml defaults SPEC_N to 2. The machine .env overrides.) --
      TARGET_MODEL: "${TARGET_MODEL:-gemma-4-31b-qat-awq-int4}"
      SPEC_N: "${SPEC_N:-0}"
      SPEC: "${SPEC:-}"
      DRAFTER_MODEL: "${DRAFTER_MODEL:-gemma-4-31b-it-assistant}"
      # -- host / device -------------------------------------------------------
      # CUDA_VISIBLE_DEVICES is host-interpolated from DEVICE_PAIR (the boot
      # exports it from the machine .env); the machine .env sets DEVICE_PAIR.
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      CUDA_VISIBLE_DEVICES: "${DEVICE_PAIR:-0,1}"
      CUDA_DEVICE_ORDER: "${CUDA_DEVICE_ORDER:-PCI_BUS_ID}"
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
      VLLM_WORKER_MULTIPROC_METHOD: "${VLLM_WORKER_MULTIPROC_METHOD:-spawn}"
      NVLINK_MODE: "${NVLINK_MODE:-auto}"
      VLLM_SKIP_P2P_CHECK: "${VLLM_SKIP_P2P_CHECK:-}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_P2P_DISABLE: "${NCCL_P2P_DISABLE:-1}"
      VLLM_NO_USAGE_STATS: "${VLLM_NO_USAGE_STATS:-1}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      # WSL2 UVA pin: the V2 runner requires UVA at RequestState init.
      VLLM_WSL2_ENABLE_PIN_MEMORY: "${VLLM_WSL2_ENABLE_PIN_MEMORY:-1}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:False}"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}"
      TRITON_CACHE_DIR: "${TRITON_CACHE_DIR:-/root/.triton/cache}"
      # -- serve shape (PACKAGE default = the source's clean-card form; the
      #    machine .env pins a box-fit if this rig needs one) ---------------
      KV_DTYPE: "${KV_DTYPE:-auto}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-229376}"
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.95}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-2}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-4096}"
      TP: "${TP:-2}"
      PP: "${PP:-1}"
      CHAT_TEMPLATE: "${CHAT_TEMPLATE:-}"
      # -- sampler row (host-interpolated into --override-generation-config) --
      TEMP: "${TEMP:-1.0}"
      TOP_P: "${TOP_P:-0.95}"
      TOP_K: "${TOP_K:-64}"
      MIN_P: "${MIN_P:-0.0}"
      REPEAT_PENALTY: "${REPEAT_PENALTY:-1.0}"
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        # Overlay-free on v0.24.0 — no boot-time patch apply. Just NVLink autodetect + serve.
        source /etc/vllm-patches/detect_nvlink.sh
        # -- Model + drafter resolution: the three-way knob grammar --------
        #   bare name   = a folder under the WEIGHTS_DIR mount (the Hugging
        #                 Face cache the container loads from)
        #   contains /  = an HF repo ID or an absolute container path,
        #                used verbatim
        _model="$${TARGET_MODEL:-gemma-4-31b-qat-awq-int4}"
        case "$$_model" in */*) : ;; *) _model="/root/.cache/huggingface/$$_model" ;; esac
        _drafter="$${DRAFTER_MODEL:-gemma-4-31b-it-assistant}"
        case "$$_drafter" in */*) : ;; *) _drafter="/root/.cache/huggingface/$$_drafter" ;; esac
        # -- Drafter toggle: the house SPEC_N/SPEC contract -----------------------
        #   SPEC_N=<n>  drafter depth; the entrypoint default is 0 in THIS
        #               yml — the MTP-off / long-ctx shape (the sibling
        #               gemma-dual.yml defaults to 2; the tier's own config file still overrides)
        #   SPEC=off    back-compat alias for SPEC_N=0
        # The source slug left MTP off (its v0.24.0 MTP×tool-calling caveat);
        # that trigger is met on the 0.28.0 pin, so the arm is wired here.
        # SPEC_N=0 is the kill switch; a non-numeric SPEC_N is a hard error,
        # so a typo can never masquerade as a silent "drafter off".
        _spec_n="$${SPEC_N:-0}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        SPEC_ARGS=()
        if [ "$$_spec_n" -gt 0 ]; then
          SPEC_ARGS=(--speculative-config "{\"model\":\"$$_drafter\",\"num_speculative_tokens\":$$_spec_n}")
          echo "[spec] drafter ON - gemma4 MTP assistant n=$$_spec_n" >&2
        else
          echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - no speculative decoding" >&2
        fi
        if [ "$${_NVLINK_ENABLED:-0}" = "1" ]; then
          exec vllm serve "$$_model" "$$@" "$${SPEC_ARGS[@]}"
        else
          exec vllm serve "$$_model" --disable-custom-all-reduce "$$@" "$${SPEC_ARGS[@]}"
        fi
      - --
    command:
      - --override-generation-config
      - '{"temperature":${TEMP:-${TEMPERATURE:-1.0}},"top_p":${TOP_P:-0.95},"top_k":${TOP_K:-64},"min_p":${MIN_P:-0.0},"repetition_penalty":${REPEAT_PENALTY:-1.0}}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - gemma-4-31b
      - gemma-4-31b-qat-awq-int4
      - --tensor-parallel-size
      - "${TP:-2}"
      - --pipeline-parallel-size
      - "${PP:-1}"
      # ---- KV format: bf16 (engine-default, overlay-free). `auto` resolves to the
      #      model dtype (bf16). int8-PTH is NOT used here (needs #40391, unmerged →
      #      silent recall cliff on v0.24.0). Ada/Blackwell users MAY override
      #      KV_DTYPE=fp8_per_token_head; sm_86 Ampere cannot (no fp8e4nv kernel).
      - --kv-cache-dtype
      - "${KV_DTYPE:-auto}"
      # ---- max-model-len / util: the source's clean-card proven form is the
      #      PACKAGE default (229376 @ 0.95). This box (WSL2/WDDM baseline
      #      ~1.4 GiB/card) cannot reach it, so the machine .env pins the box-fit
      #      (189000 @ 0.93) — a machine edit that survives rebase (the
      #      two-tier split). These are knobs here so the machine .env is in charge.
      - --max-model-len
      - "${MAX_MODEL_LEN:-229376}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.95}"
      # bf16 KV is ~2×/token vs int8-PTH → tighter pool. --max-num-seqs is a CAP:
      #   2 = one un-preempted long-ctx agent (or 2 short) · 1 = single long request
      # ⚠️ vision + near-max ctx: drop max-num-seqs/mem-util (thin headroom near 224K).
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-2}"
      # Vision tower: max_tokens_per_mm_item=2496 must fit in batched tokens.
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-4096}"
      - --trust-remote-code
      # Tool-call support — native gemma4 ParserEngine (#45588) on v0.24.0. Streaming
      # multi-tool validated clean (all args, no <|tool_call> leak) 2026-07-01.
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      # Route Gemma-4's <|channel>thought…<channel|> reasoning into reasoning_content.
      - --reasoning-parser
      - gemma4
      - --chat-template
      - /templates/${CHAT_TEMPLATE:-chat_template.jinja}
      # ⏸️ MTP disabled — see the caveat block in the header. Do NOT add --speculative-config
      #    on v0.24.0 (breaks tool-calling); restore it only when vLLM #39043/#42006 land.
